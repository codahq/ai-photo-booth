services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=3001
      - FRONTEND_ORIGIN=http://localhost:5174
    volumes:
      # Bind mount, not a named volume: Docker volumes live inside docker_data.vhdx,
      # which a Docker Desktop reset/reinstall rebuilds from scratch and silently
      # destroys. Keep this path outside C:\Users too - Windows wipes profile dirs.
      - type: bind
        source: ${PHOTO_STORAGE:-C:/photobooth}
        target: /app/storage
        bind:
          create_host_path: true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3001}
    ports:
      - '5174:80'
    depends_on:
      - backend
    restart: unless-stopped
